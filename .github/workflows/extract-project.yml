name: Extract NOX STUDY Android project

on:
  push:
    paths:
      - ".run-extract"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract project files
        run: |
          unzip -o "nox-study-nov-14-2026-12-58-01-pm.zip" -d .
          # The archive contains a second workflow file; this token cannot push workflow changes.
          rm -f .github/workflows/android-apk.yml
          rm -f .run-extract
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Add extracted NOX STUDY Android project"
            git push origin HEAD:main
          fi
